<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gate検証（scratch、本番機能ではありません）</title>
</head>
<body style="font-family:-apple-system,sans-serif;padding:24px;line-height:1.8">
<!--
  2026-09-17: iOS Safari redirect UX Gate検証専用ページ（icarus_ios_safari_login_redirect_audit.md参照）。
  Reactアプリとは無関係の独立した静的ページで、どの画面からもリンクしない。
  ux_mode:'redirect' + login_uri（icarus-api Workerのscratch route）を設定したSign in with Googleボタンを
  1つ描画するだけ。CookieのCSRFトークンとPOST bodyのCSRFトークンが実際にWorkerへ両方届くかを確認する。
  Gate検証が終わったら、このファイルとWorker側のscratch routeを両方削除する。
-->
<h1>Gate検証用ページ（本番機能ではありません）</h1>
<p>下のボタンでサインインすると、結果ページに判定が表示されます。</p>
<div id="g_id_signin"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  window.onload = function () {
    google.accounts.id.initialize({
      client_id: '1022257413413-1lvs3k00jv357ho9rfjqnjtruake985l.apps.googleusercontent.com',
      ux_mode: 'redirect',
      login_uri: 'https://icarus-api.shota-shiratori.workers.dev/auth/google-redirect-scratch',
    });
    google.accounts.id.renderButton(
      document.getElementById('g_id_signin'),
      { type: 'standard', text: 'signin_with', size: 'large', locale: 'ja', width: 240 }
    );
  };
</script>
</body>
</html>
